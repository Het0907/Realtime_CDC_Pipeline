services:
  spark-streaming:
    image: apache/spark:3.5.3-python3
    container_name: cdc-spark-streaming
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/project/streaming/spark_stream.py
      - --kafka
      - kafka:9092
      - --output
      - /opt/project/spark_bronze/events
      - --checkpoint
      - /opt/project/checkpoints/kafka_to_delta
    volumes:
      - .:/opt/project
    depends_on:
      - kafka
    restart: unless-stopped
